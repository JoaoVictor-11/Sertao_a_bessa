<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sertão a Bessa</title>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;800&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* CORES: tiradas da logo (mostarda, vinho e verde cacto). Troque aqui para outro cliente */
  --maroon:#5E0F13; --maroon-2:#7A1A1F; --sun:#E8AE2D; --sun-2:#F3CC63; --cactus:#1F5A27;
  --bg:#FFF9EC; --surface:#FFFFFF; --text:#2B1412; --muted:#6C5750; --line:#EADFC8; --ink:#7A1A1F;
  --display:"Bitter",Georgia,"Times New Roman",serif;
  --sans:"Karla",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#190D0B;--surface:#271410;--text:#F8EFDD;--muted:#BFA99B;--line:#3D2620;--ink:#F3CC63}
}
:root[data-theme="dark"]{--bg:#190D0B;--surface:#271410;--text:#F8EFDD;--muted:#BFA99B;--line:#3D2620;--ink:#F3CC63}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.08;margin:0}
.eyebrow{font:700 .78rem var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--ink);margin-bottom:12px;display:block}
h2{font-size:clamp(2rem,5vw,2.9rem);margin-bottom:14px}
.lead{color:var(--muted);max-width:56ch;margin:0 0 34px}
h3{font-size:1.2rem;margin-bottom:6px}
.btn{display:inline-block;background:var(--sun);color:var(--maroon);text-decoration:none;font-weight:700;padding:14px 28px;border-radius:999px;border:2px solid var(--sun);font-size:1rem;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.btn.small{padding:8px 20px;font-size:.92rem}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--sun-2);outline-offset:3px}

.strip{background:#3F090C;color:#EBCFB9;font-size:.84rem;text-align:center;padding:7px 12px}
header.top{position:sticky;top:0;z-index:20;background:var(--maroon);color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.25)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:10px;padding-bottom:10px}
.brandlink{display:flex;align-items:center;gap:12px;text-decoration:none}
.brandlink img{width:46px;height:46px;border-radius:50%}
.brandlink b{font-family:var(--display);font-size:1.15rem;line-height:1.1}
.brandlink small{display:block;font:600 .6rem var(--sans);letter-spacing:.24em;color:var(--sun-2)}
nav{display:none;gap:26px;font-weight:600;font-size:.95rem}
nav a{text-decoration:none;opacity:.9}
nav a:hover{opacity:1;color:var(--sun-2)}

.hero{background:radial-gradient(900px 480px at 80% 30%,#8C2026 0,transparent 62%),linear-gradient(165deg,var(--maroon-2),var(--maroon));color:#fff;overflow:hidden}
.hero .wrap{display:grid;gap:44px;padding-top:54px;padding-bottom:70px;align-items:center}
.hero .eyebrow{color:var(--sun-2)}
.hero h1{font-size:clamp(2.7rem,8vw,4.8rem)}
.hero h1 em{font-style:normal;color:var(--sun)}
.hero p{max-width:46ch;font-size:1.15rem;color:#F3DFD0;margin:22px 0 30px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.trust{display:flex;gap:26px;flex-wrap:wrap;margin-top:34px;color:#EBCFB9;font-size:.92rem}
.trust b{display:block;font-family:var(--display);font-size:1.7rem;color:var(--sun);line-height:1.1}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;background:rgba(255,255,255,.12);padding:6px 14px;border-radius:999px;margin-bottom:22px}
.dot{width:9px;height:9px;border-radius:50%;background:#A59A94}
.dot.on{background:#5BD67A;box-shadow:0 0 0 4px rgba(91,214,122,.25)}
.logoBox{justify-self:center;position:relative;width:min(330px,80%)}
.logoBox img{width:100%;border-radius:50%;box-shadow:0 26px 54px rgba(0,0,0,.4),0 0 0 8px rgba(243,204,99,.18)}

.ribbon{background:var(--sun);color:var(--maroon);overflow:hidden;white-space:nowrap;border-top:3px solid var(--maroon);border-bottom:3px solid var(--maroon)}
.ribbon div{display:inline-block;padding:13px 0;font:800 1rem var(--display);letter-spacing:.06em;animation:slide 38s linear infinite}
.ribbon span{margin:0 20px}
.ribbon svg{width:16px;height:16px;vertical-align:-2px;fill:var(--cactus)}
@keyframes slide{to{transform:translateX(-50%)}}

section{padding:78px 0}
.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(94,15,19,.12)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cactus)}
.card p{margin:0;color:var(--muted);font-size:.97rem}
.card h3{color:var(--ink)}

.green{background:var(--cactus);color:#fff}
.green .eyebrow{color:var(--sun-2)}
.green .lead{color:#DCEBDD}
.steps{display:grid;gap:20px}
.step{display:flex;gap:16px}
.step i{flex:none;width:44px;height:44px;border-radius:50%;background:var(--sun);color:var(--maroon);display:grid;place-items:center;font:800 1.2rem var(--display);font-style:normal}
.step p{margin:0;color:#DCEBDD}

.about{display:grid;gap:30px;align-items:center}
.about p{color:var(--muted);max-width:58ch;margin:0 0 14px}
.seal{justify-self:center;width:min(280px,70%);aspect-ratio:1;border-radius:50%;background:var(--sun);color:var(--maroon);display:grid;place-content:center;text-align:center;border:4px solid var(--maroon);box-shadow:0 0 0 8px var(--sun-2) inset;padding:20px}
.seal b{font:800 3.6rem/1 var(--display)}
.seal span{font-weight:700;letter-spacing:.06em;margin-top:6px}
.stats{display:flex;gap:30px;flex-wrap:wrap;margin-top:24px}
.stats b{display:block;font-family:var(--display);font-size:2.2rem;line-height:1.1;color:var(--ink)}
.stats span{color:var(--muted);font-size:.9rem}

.alt{background:var(--surface);border-top:1px solid var(--line)}
.info{display:grid;gap:40px}
.hours{width:100%;border-collapse:collapse}
.hours td{padding:12px 0;border-bottom:1px solid var(--line)}
.hours td:last-child{text-align:right;font-weight:700}
.addr p{margin:0 0 12px}
.addr a{color:var(--ink);font-weight:700}

.cta{background:var(--sun);color:var(--maroon);text-align:center;padding:68px 0}
.cta h2{margin-bottom:12px}
.cta p{margin:0 auto 26px;max-width:46ch}
.cta .btn{background:var(--maroon);color:#fff;border-color:var(--maroon)}
footer{background:#3F090C;color:#E3C9B6;padding:28px 0;font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:#25A855;color:#fff;text-decoration:none;font-weight:700;padding:13px 20px;border-radius:999px;box-shadow:0 8px 22px rgba(0,0,0,.3);font-size:.95rem}

.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}.ribbon div{animation:none}.card,.btn{transition:none}}

@media (min-width:560px){.grid.prod{grid-template-columns:repeat(2,1fr)}}
@media (min-width:820px){
  nav{display:flex}
  .hero .wrap{grid-template-columns:1.2fr .8fr}
  .grid.prod{grid-template-columns:repeat(4,1fr)}
  .green .wrap{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}
  .about{grid-template-columns:1.2fr .8fr}
  .info{grid-template-columns:1fr 1fr}
  .fab{display:none}
}
</style>
</head>
<body>
<div class="strip" id="strip"></div>
<header class="top">
  <div class="wrap">
    <a class="brandlink" href="#"><img data-img="logo" alt="Logo Sertão a Bessa"><span><b data-t="name"></b><small data-t="tag"></small></span></a>
    <nav><a href="#produtos">Produtos</a><a href="#como">Como comprar</a><a href="#sobre">Sobre</a><a href="#contato">Contato</a></nav>
    <a class="btn small" data-wa href="#" data-t="ctaShort"></a>
  </div>
</header>

<main>
  <div class="hero">
    <div class="wrap">
      <div>
        <span class="badge"><span class="dot" id="dot"></span><span id="openNow">Verificando horário...</span></span>
        <span class="eyebrow" data-t="eyebrow"></span>
        <h1 id="h1"></h1>
        <p data-t="subheadline"></p>
        <div class="row">
          <a class="btn" data-wa href="#" data-t="cta"></a>
          <a class="btn ghost" href="#produtos" data-t="secondaryCta"></a>
        </div>
        <div class="trust" id="trust"></div>
      </div>
      <div class="logoBox"><img data-img="logo" alt="Sertão a Bessa - Artigos Sertanejos"></div>
    </div>
  </div>

  <div class="ribbon" aria-hidden="true"><div id="ribbon"></div></div>

  <section id="produtos">
    <div class="wrap">
      <span class="eyebrow rv">Nossos produtos</span>
      <h2 class="rv" data-t="prodTitle"></h2>
      <p class="lead rv" data-t="prodLead"></p>
      <div class="grid prod" id="prod"></div>
    </div>
  </section>

  <section id="como" class="green">
    <div class="wrap">
      <div class="rv">
        <span class="eyebrow">Como comprar</span>
        <h2 data-t="howTitle"></h2>
        <p class="lead" data-t="howLead"></p>
        <a class="btn" data-wa href="#" data-t="cta"></a>
      </div>
      <div class="steps rv" id="steps"></div>
    </div>
  </section>

  <section id="sobre">
    <div class="wrap about">
      <div class="rv">
        <span class="eyebrow">Sobre nós</span>
        <h2 data-t="aboutTitle"></h2>
        <div id="aboutText"></div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="seal rv"><b>4,8</b><span>NOTA NO GOOGLE</span></div>
    </div>
  </section>

  <section id="contato" class="alt">
    <div class="wrap info">
      <div id="hoursWrap" class="rv"></div>
      <div class="addr rv">
        <span class="eyebrow">Contato</span>
        <h2>Onde estamos</h2>
        <p data-t="address"></p>
        <p><a data-map href="#" target="_blank" rel="noopener">Abrir no mapa</a></p>
        <p>Telefone e WhatsApp: <a data-tel href="#" data-t="phoneLabel"></a></p>
        <p><a data-ig href="#" target="_blank" rel="noopener" data-t="instagramLabel"></a></p>
      </div>
    </div>
  </section>

  <div class="cta">
    <div class="wrap">
      <h2 data-t="finalTitle"></h2>
      <p data-t="finalText"></p>
      <a class="btn" data-wa href="#" data-t="cta"></a>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span data-t="footer"></span>
    <span data-t="address"></span>
  </div>
</footer>

    const open = r && now >= r.from && now < r.to;
    $('#dot').classList.toggle('on', !!open);
    $('#openNow').textContent = open ? "Aberto agora · fecha às " + h(r.to) : "Fechado agora · confira os horários";
  } catch (e) { $('#openNow').textContent = "Confira nossos horários"; }

  const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold:.12}) : null;
  $$('.rv').forEach(el => io ? io.observe(el) : el.classList.add('in'));
})();
</script>
</body>
</html>
